<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | PCGGPRO</title>
    <style>
        :root {
            --primary: #4a9eff; --primary-dark: #3a7fd4; --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa; --bg-dark: #0a0e1a; --bg-card: #111827;
            --text: #e0e6f0; --text-muted: #8899aa; --border: #1e2a3a;
            --shadow: 0 4px 20px rgba(0,0,0,0.4); --radius: 16px; --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
            background: var(--bg-dark); color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }

        .auth-container { width: 100%; max-width: 440px; padding: 20px; }
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 40px 30px;
            box-shadow: var(--shadow); text-align: center;
        }
        .auth-card h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 14px 16px; background: var(--bg-dark);
            border: 1px solid var(--border); border-radius: 10px; color: var(--text);
            font-size: 15px; transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .btn-primary {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 0 15px var(--primary-glow); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        .code-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .code-input {
            width: 42px; height: 50px; text-align: center; font-size: 20px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-weight: 700;
        }
        .code-input:focus { outline: none; border-color: var(--primary); }

        .hidden { display: none; }
        .message { font-size: 13px; margin-top: 8px; }
        .message.success { color: var(--secondary); }
        .message.error { color: var(--danger); }

        .auth-links { margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .auth-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>🖥️ PCGGPRO</h1>

        <!-- Шаг 1: Ввод email -->
        <div id="step1">
            <p>Введите email для восстановления пароля</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.ru" required>
            </div>
            <div class="message" id="step1Msg"></div>
            <button class="btn-primary" id="sendCodeBtn" onclick="sendResetCode()">📧 Отправить код</button>
        </div>

        <!-- Шаг 2: Ввод кода -->
        <div id="step2" class="hidden">
            <p>Введите 6-значный код из письма</p>
            <div class="code-input-group" id="codeInputs">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="moveFocus(this, 'next')">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="moveFocus(this, 'next')">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="moveFocus(this, 'next')">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="moveFocus(this, 'next')">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="moveFocus(this, 'next')">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="moveFocus(this, 'done')">
            </div>
            <div class="message" id="step2Msg"></div>
            <button class="btn-primary" id="verifyCodeBtn" onclick="verifyResetCode()">✅ Подтвердить код</button>
        </div>

        <!-- Шаг 3: Новый пароль -->
        <div id="step3" class="hidden">
            <p>Придумайте новый пароль</p>
            <div class="form-group">
                <label>Новый пароль (минимум 6 символов)</label>
                <input type="password" id="newPassword" placeholder="••••••" required>
            </div>
            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" id="confirmPassword" placeholder="••••••" required>
            </div>
            <div class="message" id="step3Msg"></div>
            <button class="btn-primary" onclick="resetPassword()">🔒 Сменить пароль</button>
        </div>

        <div class="auth-links">
            <a href="https://timis01.github.io/miniappss/login.html">← Вернуться ко входу</a>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api';
    let resetEmail = '';
    let resetToken = '';

    // ========== Шаг 1: Отправка кода ==========
    async function sendResetCode() {
        const email = document.getElementById('email').value.trim();
        const msg = document.getElementById('step1Msg');

        if (!email || !email.includes('@')) {
            msg.textContent = '❌ Введите корректный email';
            msg.className = 'message error';
            return;
        }

        const btn = document.getElementById('sendCodeBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Отправка...';
        msg.textContent = '';

        try {
            const response = await fetch(`${API_URL}/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok) {
                resetEmail = email;
                resetToken = data.reset_token;
                msg.textContent = '✅ Код отправлен на вашу почту';
                msg.className = 'message success';
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('codeInputs').children[0].focus();
            } else {
                msg.textContent = '❌ ' + (data.message || 'Ошибка отправки');
                msg.className = 'message error';
                btn.disabled = false;
                btn.textContent = '📧 Отправить код';
            }
        } catch (error) {
            msg.textContent = '❌ Ошибка соединения с сервером';
            msg.className = 'message error';
            btn.disabled = false;
            btn.textContent = '📧 Отправить код';
        }
    }

    // ========== Переключение фокуса между цифрами ==========
    function moveFocus(input, action) {
        if (input.value.length === 1 && action === 'next') {
            const next = input.nextElementSibling;
            if (next && next.classList.contains('code-input')) {
                next.focus();
            }
        }
    }

    // ========== Шаг 2: Проверка кода ==========
    async function verifyResetCode() {
        const inputs = document.querySelectorAll('#codeInputs .code-input');
        let code = '';
        inputs.forEach(inp => code += inp.value);

        if (code.length < 6) {
            document.getElementById('step2Msg').textContent = '❌ Введите код полностью';
            document.getElementById('step2Msg').className = 'message error';
            return;
        }

        const msg = document.getElementById('step2Msg');
        const btn = document.getElementById('verifyCodeBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Проверка...';

        try {
            const response = await fetch(`${API_URL}/verify-reset-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail, code, reset_token: resetToken })
            });

            const data = await response.json();

            if (response.ok) {
                msg.textContent = '';
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            } else {
                msg.textContent = '❌ ' + (data.message || 'Неверный код');
                msg.className = 'message error';
                inputs.forEach(inp => inp.value = '');
                inputs[0].focus();
                btn.disabled = false;
                btn.textContent = '✅ Подтвердить код';
            }
        } catch (error) {
            msg.textContent = '❌ Ошибка соединения';
            msg.className = 'message error';
            btn.disabled = false;
            btn.textContent = '✅ Подтвердить код';
        }
    }

    // ========== Шаг 3: Смена пароля ==========
    async function resetPassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('step3Msg');

        if (newPassword.length < 6) {
            msg.textContent = '❌ Пароль должен быть не менее 6 символов';
            msg.className = 'message error';
            return;
        }

        if (newPassword !== confirmPassword) {
            msg.textContent = '❌ Пароли не совпадают';
            msg.className = 'message error';
            return;
        }

        msg.textContent = '';

        try {
            const response = await fetch(`${API_URL}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail, password: newPassword, reset_token: resetToken })
            });

            const data = await response.json();

            if (response.ok) {
                alert('✅ Пароль успешно изменён! Сейчас вы будете перенаправлены на страницу входа.');
                window.location.href = 'https://timis01.github.io/miniappss/login.html';
            } else {
                msg.textContent = '❌ ' + (data.message || 'Ошибка смены пароля');
                msg.className = 'message error';
            }
        } catch (error) {
            msg.textContent = '❌ Ошибка соединения';
            msg.className = 'message error';
        }
    }
</script>

</body>
</html>
