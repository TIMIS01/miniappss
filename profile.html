<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отслеживание заказа | PCGGPRO</title>
    <style>
        :root {
            --primary: #4a9eff;
            --primary-dark: #3a7fd4;
            --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa;
            --bg-dark: #0a0e1a;
            --bg-card: #111827;
            --bg-header: #0d1321;
            --text: #e0e6f0;
            --text-muted: #8899aa;
            --border: #1e2a3a;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --radius: 16px;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; background: var(--bg-dark); color: var(--text); line-height: 1.6; min-height: 100vh; }

        .header { background: var(--bg-header); box-shadow: 0 2px 15px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav { display: flex; gap: 25px; align-items: center; }
        .nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 15px; }
        .nav a:hover { color: var(--primary); }
        .btn-logout { background: rgba(231, 76, 60, 0.1); color: var(--danger); padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 600; cursor: pointer; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        .profile-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; margin-bottom: 25px; }
        .profile-card h1 { font-size: 24px; margin-bottom: 20px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-item label { display: block; color: var(--text-muted); font-size: 12px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .info-item span { font-size: 16px; font-weight: 500; }

        .orders-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; }
        .orders-card h2 { font-size: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-new { background: rgba(74, 158, 255, 0.2); color: var(--primary); }
        .badge-process { background: rgba(243, 156, 18, 0.2); color: #f39c12; }
        .badge-building { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
        .badge-sent { background: rgba(0, 212, 170, 0.2); color: var(--secondary); }

        .empty { text-align: center; padding: 40px; color: var(--text-muted); }
        .error { text-align: center; padding: 20px; color: var(--danger); }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
            .header-inner { flex-direction: column; gap: 10px; }
            .nav { gap: 15px; flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="https://pcggpro.ru/" class="logo">🖥️ PCGG<span>PRO</span></a>
        <nav class="nav">
            <a href="https://pcggpro.ru/">Главная</a>
            <a href="https://pcggpro.ru/#catalog">Каталог</a>
            <a href="https://pcggpro.ru/offer.html">Оферта</a>
            <a href="https://pcggpro.ru/cart.html">🛒 Корзина</a>
            <a href="#" onclick="logout()" class="btn-logout">🚪 Выйти</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="profile-card">
        <h1>👤 Личный кабинет</h1>
        <div class="info-grid" id="userInfo">
            <div class="info-item"><label>Имя</label><span id="profileName">—</span></div>
            <div class="info-item"><label>Email</label><span id="profileEmail">—</span></div>
            <div class="info-item"><label>Город</label><span id="profileCity">—</span></div>
            <div class="info-item"><label>Telegram</label><span id="profileTelegram">—</span></div>
        </div>
    </div>

    <div class="orders-card">
        <h2>📦 Мои заказы</h2>
        <div id="ordersList">
            <div class="empty">Загрузка заказов...</div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api';
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!user) {
        alert('Для просмотра заказов необходимо войти в аккаунт.');
        window.location.href = 'https://pcggpro.ru/login.html';
    }

    if (user) {
        document.getElementById('profileName').textContent = user.full_name || '—';
        document.getElementById('profileEmail').textContent = user.email || '—';
        document.getElementById('profileCity').textContent = user.city || '—';
        document.getElementById('profileTelegram').textContent = user.telegram || '—';
        loadOrders(user.email);
    }

    async function loadOrders(email) {
        const container = document.getElementById('ordersList');
        container.innerHTML = '<div class="empty">Загрузка заказов...</div>';
        try {
            const response = await fetch(`${API_URL}/orders/by-email?email=${encodeURIComponent(email)}`);
            const data = await response.json();
            const orders = data.orders || [];
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty">У вас пока нет заказов.</div>';
                return;
            }
            const statusBadges = {
                'оформлен': 'badge-new',
                'принят': 'badge-process',
                'в сборке': 'badge-building',
                'отправлен': 'badge-sent'
            };
            const statusNames = {
                'оформлен': 'Оформлен',
                'принят': 'Принят',
                'в сборке': 'В сборке',
                'отправлен': 'Отправлен'
            };
            container.innerHTML = `<table><thead><tr><th>ID</th><th>Товар</th><th>Сумма</th><th>Город</th><th>Статус</th><th>Трек-номер</th><th>Дата</th></tr></thead><tbody>${orders.map(o => {
                const date = new Date(o.created_at || o.order_date);
                return `<tr><td>#${o.id}</td><td>${o.product_name || '—'}</td><td>${(o.total_price || 0).toLocaleString()} ₽</td><td>${o.city || '—'}</td><td><span class="badge ${statusBadges[o.status] || 'badge-new'}">${statusNames[o.status] || o.status || 'Оформлен'}</span></td><td>${o.tracking_number || '—'}</td><td>${date.toLocaleDateString('ru-RU')}</td></tr>`;
            }).join('')}</tbody></table>`;
        } catch (error) {
            container.innerHTML = '<div class="empty">Ошибка загрузки заказов.</div>';
        }
    }

    function logout() {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user');
        window.location.href = 'https://pcggpro.ru/login.html';
    }
</script>

<!-- Виджет поддержки -->
<div id="supportWidget" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
    <button id="supportToggle" style="width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s;" onclick="toggleSupport()">💬</button>
    <div id="supportPanel" style="display: none; position: absolute; bottom: 70px; right: 0; width: 350px; max-width: 90vw; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0; font-size: 16px;">💬 Поддержка</h3>
            <button onclick="toggleSupport()" style="background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <form id="supportForm">
            <input type="text" id="supportName" placeholder="Ваше имя" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
            <input type="email" id="supportEmail" placeholder="Ваш email" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
            <textarea id="supportMessage" placeholder="Опишите ваш вопрос..." required style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text); min-height: 80px; resize: vertical;"></textarea>
            <button type="submit" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">📩 Отправить</button>
        </form>
    </div>
</div>

<script>
    function toggleSupport() {
        const panel = document.getElementById('supportPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }
    document.getElementById('supportForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('supportName').value.trim();
        const email = document.getElementById('supportEmail').value.trim();
        const message = document.getElementById('supportMessage').value.trim();
        if (!name || !email || !message) return;
        const btn = this.querySelector('button');
        btn.textContent = '⏳ Отправка...';
        btn.disabled = true;
        try {
            const response = await fetch('https://tg-shop-server.onrender.com/api/support', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, message, timestamp: new Date().toISOString() })
            });
            if (response.ok) {
                this.reset();
                alert('✅ Сообщение отправлено!');
                toggleSupport();
            } else {
                alert('❌ Ошибка отправки.');
            }
        } catch (error) {
            alert('❌ Ошибка соединения.');
        } finally {
            btn.textContent = '📩 Отправить';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
