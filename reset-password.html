<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | PCGGPRO</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #4a9eff; --primary-dark: #3a7fd4; --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa; --bg-dark: #0a0e1a; --bg-card: #111827;
            --text: #e0e6f0; --text-muted: #8899aa; --border: #1e2a3a;
            --shadow: 0 4px 20px rgba(0,0,0,0.4); --radius: 16px; --danger: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI','Inter',Arial,sans-serif; background: var(--bg-dark); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { width: 100%; max-width: 440px; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow); text-align: center; }
        .auth-card h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px 16px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .code-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .code-input { width: 42px; height: 50px; text-align: center; font-size: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 700; }
        .hidden { display: none; }
        .message { font-size: 13px; margin-top: 8px; } .message.success { color: var(--secondary); } .message.error { color: var(--danger); }
        .auth-links { margin-top: 20px; font-size: 14px; color: var(--text-muted); } .auth-links a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
<div class="auth-container"><div class="auth-card">
    <h1>🖥️ PCGGPRO</h1>
    <div id="step1"><p>Введите email для восстановления пароля</p><div class="form-group"><label>Email</label><input type="email" id="email" required></div><div class="message" id="step1Msg"></div><button class="btn-primary" id="sendCodeBtn" onclick="sendResetCode()">📧 Отправить код</button></div>
    <div id="step2" class="hidden"><p>Введите код из письма</p><div class="code-input-group" id="codeInputs"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1"></div><div class="message" id="step2Msg"></div><button class="btn-primary" onclick="verifyResetCode()">✅ Подтвердить</button></div>
    <div id="step3" class="hidden"><p>Придумайте новый пароль</p><div class="form-group"><label>Новый пароль</label><input type="password" id="newPassword" required></div><div class="form-group"><label>Повторите пароль</label><input type="password" id="confirmPassword" required></div><div class="message" id="step3Msg"></div><button class="btn-primary" onclick="resetPassword()">🔒 Сменить пароль</button></div>
    <div class="auth-links"><a href="https://pcggpro.ru/login.html">← Вернуться ко входу</a></div>
</div></div>
<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api'; let resetEmail='',resetToken='';
    async function sendResetCode(){const e=document.getElementById('email').value.trim(),m=document.getElementById('step1Msg'),b=document.getElementById('sendCodeBtn'); if(!e||!e.includes('@')){m.textContent='❌ Введите корректный email';m.className='message error';return;} b.disabled=true;b.textContent='⏳ Отправка...'; try{const r=await fetch(`${API_URL}/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e})});const d=await r.json(); if(r.ok){resetEmail=e;resetToken=d.reset_token;m.textContent='✅ Код отправлен';m.className='message success';document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');}else{m.textContent='❌ '+(d.message||'Ошибка');m.className='message error';b.disabled=false;b.textContent='📧 Отправить код';}}catch(err){m.textContent='❌ Ошибка соединения';b.disabled=false;b.textContent='📧 Отправить код';}}
    function moveFocus(i,a){if(i.value.length===1&&a==='next'){const n=i.nextElementSibling;if(n)n.focus();}}
    async function verifyResetCode(){const is=document.querySelectorAll('#codeInputs .code-input');let c='';is.forEach(i=>c+=i.value);if(c.length<6){document.getElementById('step2Msg').textContent='❌ Введите код полностью';return;} const m=document.getElementById('step2Msg'); try{const r=await fetch(`${API_URL}/verify-reset-code`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,code:c,reset_token:resetToken})}); if(r.ok){document.getElementById('step2').classList.add('hidden');document.getElementById('step3').classList.remove('hidden');}else{const d=await r.json();m.textContent='❌ '+(d.message||'Неверный код');m.className='message error';is.forEach(i=>i.value='');is[0].focus();}}catch(err){m.textContent='❌ Ошибка соединения';}}
    async function resetPassword(){const np=document.getElementById('newPassword').value,cp=document.getElementById('confirmPassword').value,m=document.getElementById('step3Msg'); if(np.length<6){m.textContent='❌ Пароль должен быть не менее 6 символов';return;} if(np!==cp){m.textContent='❌ Пароли не совпадают';return;} try{const r=await fetch(`${API_URL}/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,password:np,reset_token:resetToken})}); if(r.ok){alert('✅ Пароль изменён!');window.location.href='https://pcggpro.ru/login.html';}else{const d=await r.json();m.textContent='❌ '+(d.message||'Ошибка');}}catch(err){m.textContent='❌ Ошибка соединения';}}
</script>
</body>
</html>
