<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | PCGGPRO</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #4a9eff; --primary-dark: #3a7fd4; --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa; --bg-dark: #0a0e1a; --bg-card: #111827;
            --bg-header: #00276a; --text: #e0e6f0; --text-muted: #8899aa;
            --border: #1e2a3a; --shadow: 0 4px 20px rgba(0,0,0,0.4); --radius: 16px; --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI','Inter',Arial,sans-serif; background: var(--bg-dark); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-container { width: 100%; max-width: 440px; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow); text-align: center; }
        .auth-card h1 { font-size: 28px; margin-bottom: 8px; color: var(--text); }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px 16px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .email-row { display: flex; gap: 10px; } .email-row input { flex: 1; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 0 15px var(--primary-glow); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .btn-outline { padding: 14px 16px; background: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.3s; }
        .btn-outline:hover { background: rgba(74,158,255,0.1); }
        .btn-outline:disabled { border-color: #555; color: #555; cursor: not-allowed; }
        .verify-box { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 10px; margin-bottom: 10px; display: none; }
        .code-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .code-input { width: 42px; height: 50px; text-align: center; font-size: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 700; }
        .code-input:focus { outline: none; border-color: var(--primary); }
        .auth-links { margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .auth-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .message { font-size: 13px; margin-top: 8px; } .message.success { color: var(--secondary); } .message.error { color: var(--danger); }
        .phone-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
<div class="auth-container"><div class="auth-card">
    <h1>🖥️ PCGGPRO</h1>
    <p>Создайте аккаунт для оформления заказов</p>
    <form id="registerForm">
        <div class="form-group"><label>Имя</label><input type="text" id="name" placeholder="Введите ваше имя" required></div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="phone" placeholder="+7 (900) 123-45-67" required>
            <div class="phone-hint">📱 Для связи с вами по вопросам заказа</div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <div class="email-row">
                <input type="email" id="email" placeholder="example@mail.ru" required>
                <button type="button" class="btn-outline" id="sendCodeBtn" onclick="sendVerificationCode()">📧 Отправить код</button>
            </div>
            <div class="message" id="sendCodeMsg"></div>
        </div>
        <div class="verify-box" id="verifyBox">
            <p>📩 Мы отправили 6-значный код на вашу почту. Введите его ниже:</p>
            <div class="code-input-group" id="codeInputs">
                <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
                <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
                <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
                <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
                <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
                <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'done')">
            </div>
            <div class="message" id="verifyMsg"></div>
        </div>
        <div class="form-group"><label>Город</label><input type="text" id="city" placeholder="Москва" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="password" placeholder="Минимум 6 символов" required>
            <div class="message error" id="passwordError">Пароль должен быть не менее 6 символов</div>
        </div>
        <button type="submit" class="btn-primary" id="registerBtn" disabled>🚀 Зарегистрироваться</button>
    </form>
    <div class="auth-links">Уже есть аккаунт? <a href="https://pcggpro.ru/login.html">Войти</a></div>
</div></div>

<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api';
    let emailVerified = false;

    // ===== ОТПРАВКА КОДА НА ПОЧТУ =====
    async function sendVerificationCode() {
        const email = document.getElementById('email').value.trim();
        const sendBtn = document.getElementById('sendCodeBtn');
        const msgEl = document.getElementById('sendCodeMsg');

        if (!email || !email.includes('@')) {
            msgEl.textContent = '❌ Введите корректный email';
            msgEl.className = 'message error';
            return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = '⏳ Отправка...';
        msgEl.textContent = '';
        msgEl.className = 'message';

        try {
            const response = await fetch(`${API_URL}/send-verification`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            if (response.ok) {
                document.getElementById('verifyBox').style.display = 'block';
                msgEl.textContent = '✅ Код отправлен на вашу почту';
                msgEl.className = 'message success';
                sendBtn.textContent = '📧 Отправлено';
                document.getElementById('codeInputs').children[0].focus();
            } else {
                const data = await response.json();
                msgEl.textContent = '❌ ' + (data.message || 'Ошибка отправки');
                msgEl.className = 'message error';
                sendBtn.disabled = false;
                sendBtn.textContent = '📧 Отправить код';
            }
        } catch (error) {
            msgEl.textContent = '❌ Ошибка соединения с сервером';
            msgEl.className = 'message error';
            sendBtn.disabled = false;
            sendBtn.textContent = '📧 Отправить код';
        }
    }

    // ===== ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ПОЛЯМИ КОДА =====
    function moveFocus(input, action) {
        if (input.value.length === 1 && action === 'next') {
            const next = input.nextElementSibling;
            if (next && next.classList.contains('code-input')) {
                next.focus();
            } else {
                checkVerificationCode();
            }
        }
    }

    // ===== ПРОВЕРКА КОДА =====
    async function checkVerificationCode() {
        const inputs = document.querySelectorAll('.code-input');
        let code = '';
        inputs.forEach(inp => code += inp.value);

        if (code.length < 6) return;

        const msgEl = document.getElementById('verifyMsg');
        const email = document.getElementById('email').value.trim();

        try {
            const response = await fetch(`${API_URL}/verify-email`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, code: code })
            });

            if (response.ok) {
                emailVerified = true;
                msgEl.textContent = '✅ Почта подтверждена!';
                msgEl.className = 'message success';
                document.getElementById('email').readOnly = true;
                document.getElementById('registerBtn').disabled = false;
                inputs.forEach(inp => inp.disabled = true);
            } else {
                emailVerified = false;
                msgEl.textContent = '❌ Неверный код. Попробуйте ещё раз.';
                msgEl.className = 'message error';
                inputs.forEach(inp => inp.value = '');
                inputs[0].focus();
            }
        } catch (error) {
            msgEl.textContent = '❌ Ошибка проверки. Попробуйте позже.';
            msgEl.className = 'message error';
        }
    }

    // ===== АВТОПРОВЕРКА КОДА =====
    document.querySelectorAll('.code-input').forEach(inp => {
        inp.addEventListener('input', function() {
            const allFilled = Array.from(document.querySelectorAll('.code-input'))
                .every(i => i.value.length === 1);
            if (allFilled) {
                checkVerificationCode();
            }
        });
    });

    // ===== ОТПРАВКА ФОРМЫ =====
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim().replace(/\D/g, '');
        const email = document.getElementById('email').value.trim();
        const city = document.getElementById('city').value.trim();
        const password = document.getElementById('password').value;
        const passwordError = document.getElementById('passwordError');

        if (!name || !phone || !email || !city) {
            alert('❌ Пожалуйста, заполните все обязательные поля.');
            return;
        }

        if (phone.length < 10) {
            alert('❌ Введите корректный номер телефона (не менее 10 цифр).');
            return;
        }

        if (password.length < 6) {
            passwordError.style.display = 'block';
            return;
        } else {
            passwordError.style.display = 'none';
        }

        if (!emailVerified) {
            alert('❌ Пожалуйста, подтвердите вашу почту кодом из письма.');
            return;
        }

        const btn = document.getElementById('registerBtn');
        btn.textContent = '⏳ Регистрация...';
        btn.disabled = true;

        try {
            const response = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    full_name: name,
                    phone: phone,
                    email: email,
                    city: city,
                    password: password,
                    email_verified: true
                })
            });

            const data = await response.json();

            if (response.ok) {
                alert('✅ Регистрация прошла успешно!');
                window.location.href = 'https://pcggpro.ru/login.html';
            } else {
                alert('❌ Ошибка: ' + (data.message || 'Не удалось зарегистрироваться'));
                btn.textContent = '🚀 Зарегистрироваться';
                btn.disabled = false;
            }
        } catch (error) {
            alert('❌ Ошибка соединения с сервером. Попробуйте позже.');
            btn.textContent = '🚀 Зарегистрироваться';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
