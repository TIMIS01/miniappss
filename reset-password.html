<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | PCGGPRO</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #4a9eff; --primary-dark: #3a7fd4; --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa; --bg-dark: #0a0e1a; --bg-card: #111827;
            --text: #e0e6f0; --text-muted: #8899aa; --border: #1e2a3a;
            --shadow: 0 4px 20px rgba(0,0,0,0.4); --radius: 16px; --danger: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI','Inter',Arial,sans-serif; background: var(--bg-dark); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { width: 100%; max-width: 440px; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow); text-align: center; }
        .auth-card h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px 16px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .code-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .code-input { width: 42px; height: 50px; text-align: center; font-size: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 700; }
        .code-input:focus { outline: none; border-color: var(--primary); }
        .hidden { display: none; }
        .message { font-size: 13px; margin-top: 8px; } .message.success { color: var(--secondary); } .message.error { color: var(--danger); } .message.info { color: var(--primary); }
        .auth-links { margin-top: 20px; font-size: 14px; color: var(--text-muted); } .auth-links a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
<div class="auth-container"><div class="auth-card">
    <h1>🖥️ PCGGPRO</h1>

    <!-- ШАГ 1: Ввод email -->
    <div id="step1">
        <p>Введите email для восстановления пароля</p>
        <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
        <div class="message" id="step1Msg"></div>
        <button class="btn-primary" id="sendCodeBtn" onclick="sendResetCode()">📧 Отправить код</button>
    </div>

    <!-- ШАГ 2: Ввод кода из письма -->
    <div id="step2" class="hidden">
        <p>Введите код из письма</p>
        <div class="code-input-group" id="codeInputs">
            <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
            <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
            <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
            <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
            <input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')">
            <input type="text" class="code-input" maxlength="1">
        </div>
        <div class="message" id="step2Msg"></div>
        <button class="btn-primary" onclick="verifyResetCode()">✅ Подтвердить</button>
    </div>

    <!-- ШАГ 3: Новый пароль -->
    <div id="step3" class="hidden">
        <p>Придумайте новый пароль</p>
        <div class="form-group"><label>Новый пароль</label><input type="password" id="newPassword" required></div>
        <div class="form-group"><label>Повторите пароль</label><input type="password" id="confirmPassword" required></div>
        <div class="message" id="step3Msg"></div>
        <button class="btn-primary" onclick="resetPassword()">🔒 Сменить пароль</button>
    </div>

    <div class="auth-links"><a href="https://pcggpro.ru/login.html">← Вернуться ко входу</a></div>
</div></div>

<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api';
    let resetEmail = '';
    let resetToken = '';

    // ===== ОТПРАВКА КОДА =====
    async function sendResetCode() {
        const email = document.getElementById('email').value.trim();
        const msgEl = document.getElementById('step1Msg');
        const btn = document.getElementById('sendCodeBtn');

        if (!email || !email.includes('@')) {
            msgEl.textContent = '❌ Введите корректный email';
            msgEl.className = 'message error';
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ Отправка...';
        msgEl.textContent = '';
        msgEl.className = 'message';

        try {
            const response = await fetch(`${API_URL}/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();

            if (response.ok) {
                resetEmail = email;
                resetToken = data.reset_token;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                msgEl.textContent = '✅ Код отправлен на почту';
                msgEl.className = 'message success';
                document.querySelector('#codeInputs .code-input').focus();
            } else {
                msgEl.textContent = '❌ ' + (data.message || 'Ошибка отправки');
                msgEl.className = 'message error';
                btn.disabled = false;
                btn.textContent = '📧 Отправить код';
            }
        } catch (error) {
            msgEl.textContent = '❌ Ошибка соединения с сервером';
            msgEl.className = 'message error';
            btn.disabled = false;
            btn.textContent = '📧 Отправить код';
        }
    }

    // ===== ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ПОЛЯМИ КОДА =====
    function moveFocus(input, action) {
        if (input.value.length === 1 && action === 'next') {
            const next = input.nextElementSibling;
            if (next && next.classList.contains('code-input')) {
                next.focus();
            }
        }
    }

    // ===== ПРОВЕРКА КОДА =====
    async function verifyResetCode() {
        const inputs = document.querySelectorAll('#codeInputs .code-input');
        let code = '';
        inputs.forEach(inp => code += inp.value);

        if (code.length < 6) {
            document.getElementById('step2Msg').textContent = '❌ Введите все 6 цифр';
            document.getElementById('step2Msg').className = 'message error';
            return;
        }

        const msgEl = document.getElementById('step2Msg');
        msgEl.textContent = '⏳ Проверка...';
        msgEl.className = 'message info';

        try {
            const response = await fetch(`${API_URL}/verify-reset-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: resetEmail,
                    code: code,
                    reset_token: resetToken
                })
            });

            if (response.ok) {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            } else {
                const data = await response.json();
                msgEl.textContent = '❌ ' + (data.message || 'Неверный код');
                msgEl.className = 'message error';
                inputs.forEach(inp => inp.value = '');
                inputs[0].focus();
            }
        } catch (error) {
            msgEl.textContent = '❌ Ошибка соединения с сервером';
            msgEl.className = 'message error';
        }
    }

    // ===== СМЕНА ПАРОЛЯ =====
    async function resetPassword() {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        const msgEl = document.getElementById('step3Msg');

        if (newPass.length < 6) {
            msgEl.textContent = '❌ Пароль должен быть не менее 6 символов';
            msgEl.className = 'message error';
            return;
        }

        if (newPass !== confirmPass) {
            msgEl.textContent = '❌ Пароли не совпадают';
            msgEl.className = 'message error';
            return;
        }

        msgEl.textContent = '⏳ Сохранение...';
        msgEl.className = 'message info';

        try {
            const response = await fetch(`${API_URL}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: resetEmail,
                    password: newPass,
                    reset_token: resetToken
                })
            });

            if (response.ok) {
                alert('✅ Пароль успешно изменён!');
                window.location.href = 'https://pcggpro.ru/login.html';
            } else {
                const data = await response.json();
                msgEl.textContent = '❌ ' + (data.message || 'Ошибка смены пароля');
                msgEl.className = 'message error';
            }
        } catch (error) {
            msgEl.textContent = '❌ Ошибка соединения с сервером';
            msgEl.className = 'message error';
        }
    }

    // ===== АВТОПРОВЕРКА КОДА =====
    document.querySelectorAll('#codeInputs .code-input').forEach(inp => {
        inp.addEventListener('input', function() {
            const allFilled = Array.from(document.querySelectorAll('#codeInputs .code-input'))
                .every(i => i.value.length === 1);
            if (allFilled) {
                verifyResetCode();
            }
        });
        inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                verifyResetCode();
            }
        });
    });
</script>
</body>
</html>
