<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | PCGGPRO</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #4a9eff; --primary-dark: #3a7fd4; --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa; --bg-dark: #0a0e1a; --bg-card: #111827;
            --bg-header: #00276a; --text: #e0e6f0; --text-muted: #8899aa;
            --border: #1e2a3a; --shadow: 0 4px 20px rgba(0,0,0,0.4); --radius: 16px; --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI','Inter',Arial,sans-serif; background: var(--bg-dark); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-container { width: 100%; max-width: 440px; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow); text-align: center; }
        .auth-card h1 { font-size: 28px; margin-bottom: 8px; color: var(--text); }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px 16px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .email-row { display: flex; gap: 10px; } .email-row input { flex: 1; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 0 15px var(--primary-glow); }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .btn-outline { padding: 14px 16px; background: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-outline:hover { background: rgba(74,158,255,0.1); }
        .btn-outline:disabled { border-color: #555; color: #555; cursor: not-allowed; }
        .verify-box { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 10px; margin-bottom: 10px; display: none; }
        .code-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .code-input { width: 42px; height: 50px; text-align: center; font-size: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 700; }
        .code-input:focus { outline: none; border-color: var(--primary); }
        .auth-links { margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .auth-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .message { font-size: 13px; margin-top: 8px; } .message.success { color: var(--secondary); } .message.error { color: var(--danger); }
    </style>
</head>
<body>
<div class="auth-container"><div class="auth-card">
    <h1>🖥️ PCGGPRO</h1><p>Создайте аккаунт для оформления заказов</p>
    <form id="registerForm">
        <div class="form-group"><label>Имя</label><input type="text" id="name" placeholder="Введите ваше имя" required></div>
        <div class="form-group"><label>Email</label><div class="email-row"><input type="email" id="email" placeholder="example@mail.ru" required><button type="button" class="btn-outline" id="sendCodeBtn" onclick="sendVerificationCode()">📧 Отправить код</button></div><div class="message" id="sendCodeMsg"></div></div>
        <div class="verify-box" id="verifyBox"><p>📩 Мы отправили 6-значный код на вашу почту. Введите его ниже:</p><div class="code-input-group" id="codeInputs"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'next')"><input type="text" class="code-input" maxlength="1" oninput="moveFocus(this,'done')"></div><div class="message" id="verifyMsg"></div></div>
        <div class="form-group"><label>Telegram (необязательно)</label><input type="text" id="telegram" placeholder="@username"></div>
        <div class="form-group"><label>Город</label><input type="text" id="city" placeholder="Москва" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="password" placeholder="Минимум 6 символов" required><div class="message error" id="passwordError">Пароль должен быть не менее 6 символов</div></div>
        <button type="submit" class="btn-primary" id="registerBtn">🚀 Зарегистрироваться</button>
    </form>
    <div class="auth-links">Уже есть аккаунт? <a href="https://pcggpro.ru/login.html">Войти</a></div>
</div></div>
<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api'; let emailVerified = false;
    async function sendVerificationCode() { const e=document.getElementById('email').value.trim(),b=document.getElementById('sendCodeBtn'),m=document.getElementById('sendCodeMsg'); if(!e||!e.includes('@')){m.textContent='❌ Введите корректный email';m.className='message error';return;} b.disabled=true;b.textContent='⏳ Отправка...'; try{const r=await fetch(`${API_URL}/send-verification`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e})}); if(r.ok){document.getElementById('verifyBox').style.display='block';m.textContent='✅ Код отправлен';m.className='message success';b.textContent='📧 Отправлено';document.getElementById('codeInputs').children[0].focus();}else{const d=await r.json();m.textContent='❌ '+(d.message||'Ошибка');m.className='message error';b.disabled=false;b.textContent='📧 Отправить код';}}catch(err){m.textContent='❌ Ошибка соединения';m.className='message error';b.disabled=false;b.textContent='📧 Отправить код';} }
    function moveFocus(i,a){if(i.value.length===1&&a==='next'){const n=i.nextElementSibling;if(n&&n.classList.contains('code-input'))n.focus();else checkVerificationCode();}}
    async function checkVerificationCode(){const is=document.querySelectorAll('.code-input');let c='';is.forEach(i=>c+=i.value);if(c.length<6)return;const m=document.getElementById('verifyMsg'),e=document.getElementById('email').value.trim(); try{const r=await fetch(`${API_URL}/verify-email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,code:c})}); if(r.ok){emailVerified=true;m.textContent='✅ Почта подтверждена!';m.className='message success';document.getElementById('email').readOnly=true;}else{emailVerified=false;m.textContent='❌ Неверный код';m.className='message error';is.forEach(i=>i.value='');is[0].focus();}}catch(err){m.textContent='❌ Ошибка проверки';m.className='message error';}}
    document.querySelectorAll('.code-input').forEach(i=>i.addEventListener('input',()=>{if(Array.from(document.querySelectorAll('.code-input')).filter(x=>x.value.length===1).length===6)checkVerificationCode();}));
    document.getElementById('registerForm').addEventListener('submit',async function(e){e.preventDefault();const n=document.getElementById('name').value.trim(),em=document.getElementById('email').value.trim(),t=document.getElementById('telegram').value.trim(),c=document.getElementById('city').value.trim(),p=document.getElementById('password').value; if(p.length<6){document.getElementById('passwordError').style.display='block';return;}else{document.getElementById('passwordError').style.display='none';} if(!emailVerified){alert('❌ Подтвердите почту кодом из письма.');return;} try{const r=await fetch(`${API_URL}/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:n,email:em,telegram:t,city:c,password:p,email_verified:true})}); if(r.ok){alert('✅ Регистрация прошла успешно!');window.location.href='https://pcggpro.ru/login.html';}else{const d=await r.json();alert('❌ Ошибка: '+(d.message||'Не удалось зарегистрироваться'));}}catch(err){alert('❌ Ошибка соединения.');}});
</script>
</body>
</html>
