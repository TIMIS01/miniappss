<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар | PCGGPRO</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #4a9eff;
            --primary-dark: #3a7fd4;
            --primary-glow: rgba(74, 158, 255, 0.3);
            --secondary: #00d4aa;
            --bg-dark: #0a0e1a;
            --bg-card: #111827;
            --bg-header: #00276a;
            --text: #e0e6f0;
            --text-muted: #8899aa;
            --border: #1e2a3a;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-hover: 0 8px 30px rgba(74, 158, 255, 0.15);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; background: var(--bg-dark); color: var(--text); line-height: 1.6; min-height: 100vh; }

        .header { background: var(--bg-header); box-shadow: 0 2px 15px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo img { height: 40px; vertical-align: middle; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; white-space: nowrap; }
        .nav { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: color 0.3s; font-size: 14px; white-space: nowrap; }
        .nav a:hover { color: var(--primary); }
        #cart-count { background: var(--secondary); color: #000; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 700; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 30px; transition: color 0.3s; }
        .back-link:hover { color: var(--primary); }

        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: var(--bg-card); border-radius: var(--radius); padding: 30px; border: 1px solid var(--border); }

        .product-gallery { position: relative; }
        .main-image { width: 100%; height: 350px; object-fit: contain; border-radius: 12px; background: var(--bg-dark); }
        .thumbnails { display: flex; gap: 10px; margin-top: 15px; }
        .thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.3s; background: var(--bg-dark); }
        .thumb:hover, .thumb.active { border-color: var(--primary); }

        .product-info h1 { font-size: 28px; margin-bottom: 5px; color: var(--text); }
        .product-price { font-size: 32px; font-weight: 800; color: var(--secondary); margin: 20px 0; }

        .specs-table { width: 100%; margin: 25px 0; border-collapse: collapse; }
        .specs-table td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .specs-table td:first-child { color: var(--text-muted); width: 40%; }
        .specs-table td:last-child { color: var(--text); font-weight: 500; }

        .btn-buy { display: block; width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.3s; text-align: center; margin-top: 20px; text-decoration: none; }
        .btn-buy:hover { background: var(--primary-dark); box-shadow: 0 0 25px var(--primary-glow); transform: translateY(-2px); }
        .btn-buy.added { background: var(--secondary); }
        .btn-buy.in-cart { background: var(--secondary); }

        .quantity-selector { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
        .qty-btn { width: 40px; height: 40px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text); border-radius: 10px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .qty-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        #qtyDisplay { font-size: 18px; font-weight: 600; min-width: 40px; text-align: center; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--secondary); color: #000; padding: 14px 28px; border-radius: 25px; font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }

        @media (max-width: 768px) {
            .header-inner { flex-direction: column; align-items: center; gap: 8px; }
            .logo img { height: 30px; }
            .nav { gap: 10px; width: 100%; justify-content: center; }
            .nav a { font-size: 13px; padding: 4px 8px; }
            .product-grid { grid-template-columns: 1fr; gap: 25px; padding: 20px; }
            .main-image { height: 250px; }
            .product-info h1 { font-size: 22px; }
            .product-price { font-size: 26px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="https://pcggpro.ru/" class="logo"><img src="logo.png" alt="PCGGPRO"></a>
        <nav class="nav">
            <a href="https://pcggpro.ru/">Главная</a>
            <a href="https://pcggpro.ru/#catalog">Каталог</a>
            <a href="https://pcggpro.ru/offer.html">Оферта</a>
            <a href="https://pcggpro.ru/cart.html">🛒 Корзина <span id="cart-count">0</span></a>
            <a href="https://pcggpro.ru/profile.html">👤 Профиль</a>
        </nav>
    </div>
</header>

<div class="container">
    <a href="https://pcggpro.ru/" class="back-link">← Назад в каталог</a>
    <div class="product-grid">
        <div class="product-gallery">
            <img id="mainImage" class="main-image" src="" alt="Товар">
            <div class="thumbnails" id="thumbnails"></div>
        </div>
        <div class="product-info">
            <h1 id="productName">Загрузка...</h1>
            <div class="product-price" id="productPrice">0 ₽</div>
            <table class="specs-table" id="specsTable"></table>
            <div class="quantity-selector">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span id="qtyDisplay">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <a href="https://pcggpro.ru/cart.html" class="btn-buy" id="goToCartBtn" style="display:none;">🛒 Перейти в корзину</a>
            <button class="btn-buy" id="buyBtn" onclick="addToCart()">🛒 В корзину</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">✅ Добавлено в корзину</div>

<script>
    const API_URL = 'https://tg-shop-server.onrender.com/api';
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    let currentProduct = null;
    let currentQuantity = 1;

    function changeQty(delta) {
        currentQuantity = Math.max(1, currentQuantity + delta);
        document.getElementById('qtyDisplay').textContent = currentQuantity;
    }

    function updateButtonState() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const inCart = cart.some(item => item.id == productId);
        if (inCart) {
            document.getElementById('buyBtn').style.display = 'none';
            document.getElementById('goToCartBtn').style.display = 'block';
        } else {
            document.getElementById('buyBtn').style.display = 'block';
            document.getElementById('goToCartBtn').style.display = 'none';
        }
    }

    async function loadProduct() {
        if (!productId) { document.getElementById('productName').textContent = 'Товар не найден'; return; }
        try {
            const response = await fetch(`${API_URL}/products`);
            const data = await response.json();
            const product = (data.products || []).find(p => p.id == productId);
            if (!product) { document.getElementById('productName').textContent = 'Товар не найден'; return; }
            currentProduct = product;
            document.getElementById('productName').textContent = product.name;
            document.getElementById('productPrice').textContent = `${product.price.toLocaleString()} ₽`;
            const images = product.images || [];
            if (images.length > 0) {
                document.getElementById('mainImage').src = images[0];
                const thumbnails = document.getElementById('thumbnails');
                thumbnails.innerHTML = images.map((img, i) => `<img src="${img}" class="thumb ${i===0?'active':''}" onclick="document.getElementById('mainImage').src='${img}';document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));event.target.classList.add('active')" onerror="this.style.display='none'">`).join('');
            }
            const specs = [];
            if (product.cpu) specs.push({label:'🖥️ Процессор', value:product.cpu});
            if (product.gpu) specs.push({label:'🎮 Видеокарта', value:product.gpu});
            if (product.ram) specs.push({label:'🧠 ОЗУ', value:product.ram});
            if (product.storage) specs.push({label:'💾 Накопитель', value:product.storage});
            if (product.psu) specs.push({label:'⚡ Блок питания', value:product.psu});
            if (product.description) specs.push({label:'📝 Описание', value:product.description});
            document.getElementById('specsTable').innerHTML = specs.map(s => `<tr><td>${s.label}</td><td>${s.value}</td></tr>`).join('');
            updateButtonState();
        } catch (error) { document.getElementById('productName').textContent = 'Ошибка загрузки'; }
    }

    function addToCart() {
        if (!currentProduct) return;
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const existing = cart.find(item => item.id === currentProduct.id);
        if (existing) { existing.quantity += currentQuantity; }
        else { cart.push({id:currentProduct.id, name:currentProduct.name, price:currentProduct.price, quantity:currentQuantity}); }
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        updateButtonState();
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        document.getElementById('cart-count').textContent = cart.reduce((s,i) => s + (i.quantity||1), 0);
    }

    loadProduct(); updateCartCount();
</script>

<!-- Виджет чата поддержки -->
<div id="supportWidget" style="position:fixed;bottom:20px;right:20px;z-index:9999;font-family:'Segoe UI',Arial,sans-serif;">
    <button id="supportToggle" style="width:60px;height:60px;border-radius:50%;background:var(--primary,#4a9eff);color:white;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:transform 0.2s;" onclick="toggleSupport()">💬</button>
    
    <div id="supportPanel" style="display:none;position:absolute;bottom:70px;right:0;width:380px;max-width:90vw;background:#111827;border:1px solid #1e2a3a;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.4);overflow:hidden;">
        <div style="background:#0d1321;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2a3a;">
            <h3 style="margin:0;font-size:16px;color:#e0e6f0;">💬 Поддержка</h3>
            <button onclick="toggleSupport()" style="background:none;border:none;color:#8899aa;font-size:20px;cursor:pointer;">✕</button>
        </div>
        
        <div id="chatMessages" style="height:300px;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;">
            <div style="text-align:center;color:#8899aa;font-size:12px;padding:10px;">
                ⚠️ История чата хранится 7 дней, после чего автоматически удаляется.
            </div>
        </div>
        
        <div id="chatInputArea" style="padding:15px;border-top:1px solid #1e2a3a;display:none;gap:8px;">
            <input type="text" id="chatInput" placeholder="Введите сообщение..." style="flex:1;padding:12px;background:#0a0e1a;border:1px solid #1e2a3a;border-radius:10px;color:#e0e6f0;font-size:14px;">
            <button id="chatFileBtn" onclick="document.getElementById('chatFileInput').click()" style="padding:12px;background:transparent;border:1px solid #1e2a3a;color:#8899aa;border-radius:10px;cursor:pointer;font-size:18px;">📎</button>
            <input type="file" id="chatFileInput" style="display:none;" onchange="sendChatFile()" accept="image/*,video/*,.pdf,.doc,.docx,.txt">
            <button id="chatSendBtn" onclick="sendChatMessage()" style="padding:12px 18px;background:#4a9eff;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">📩</button>
        </div>
        
        <div id="chatContact" style="padding:15px;border-top:1px solid #1e2a3a;">
            <input type="text" id="chatName" placeholder="Ваше имя" style="width:100%;padding:10px;margin-bottom:8px;background:#0a0e1a;border:1px solid #1e2a3a;border-radius:8px;color:#e0e6f0;">
            <input type="email" id="chatEmail" placeholder="Ваш email" style="width:100%;padding:10px;margin-bottom:8px;background:#0a0e1a;border:1px solid #1e2a3a;border-radius:8px;color:#e0e6f0;">
            <button onclick="startChat()" style="width:100%;padding:12px;background:#4a9eff;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Начать чат</button>
        </div>
    </div>
</div>

<script>
    const SUPPORT_API = 'https://tg-shop-server.onrender.com/api';
    let chatSessionId = localStorage.getItem('chat_session_id') || null;
    let chatPollingInterval = null;

    const chatUser = JSON.parse(localStorage.getItem('user') || 'null');
    if (chatUser) {
        document.getElementById('chatName').value = chatUser.full_name || '';
        document.getElementById('chatEmail').value = chatUser.email || '';
    }

    function toggleSupport() {
        const panel = document.getElementById('supportPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        if (panel.style.display === 'block') {
            if (chatSessionId) {
                document.getElementById('chatContact').style.display = 'none';
                document.getElementById('chatInputArea').style.display = 'flex';
                startPolling();
            } else if (chatUser) {
                startChat();
            } else {
                document.getElementById('chatContact').style.display = 'block';
                document.getElementById('chatInputArea').style.display = 'none';
            }
        } else {
            stopPolling();
        }
    }

    async function startChat() {
        const name = document.getElementById('chatName').value.trim();
        const email = document.getElementById('chatEmail').value.trim();
        if (!name || !email) { alert('Пожалуйста, заполните имя и email.'); return; }
        
        try {
            const response = await fetch(`${SUPPORT_API}/chat/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });
            
            if (response.ok) {
                const data = await response.json();
                chatSessionId = data.session_id;
                localStorage.setItem('chat_session_id', chatSessionId);
                document.getElementById('chatContact').style.display = 'none';
                document.getElementById('chatInputArea').style.display = 'flex';
                addMessage('system', '⚠️ История чата хранится 7 дней, после чего автоматически удаляется.');
                addMessage('system', 'Вы можете отправлять фото, видео и документы (до 10 МБ).');
                startPolling();
            } else {
                alert('❌ Ошибка при создании чата. Попробуйте позже.');
            }
        } catch (error) {
            alert('❌ Ошибка соединения с сервером.');
        }
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message || !chatSessionId) return;
        
        input.value = '';
        input.disabled = true;
        document.getElementById('chatSendBtn').disabled = true;
        
        addMessage('user', message);
        
        try {
            await fetch(`${SUPPORT_API}/chat/message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: chatSessionId,
                    message: message,
                    sender: 'user'
                })
            });
        } catch (error) {
            console.error('Ошибка отправки:', error);
        }
        
        input.disabled = false;
        document.getElementById('chatSendBtn').disabled = false;
        input.focus();
    }

    async function sendChatFile() {
        const fileInput = document.getElementById('chatFileInput');
        const file = fileInput.files[0];
        if (!file || !chatSessionId) return;
        
        if (file.size > 10 * 1024 * 1024) {
            alert('Файл слишком большой. Максимальный размер — 10 МБ.');
            fileInput.value = '';
            return;
        }
        
        addMessage('user', `📎 Отправка файла: ${file.name}...`);
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const response = await fetch(`${SUPPORT_API}/chat/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: chatSessionId,
                        message: `📎 ${file.name}`,
                        sender: 'user',
                        file_data: e.target.result,
                        file_name: file.name,
                        file_type: file.type
                    })
                });
                
                if (response.ok) {
                    addMessage('user', `✅ Файл отправлен: ${file.name}`);
                } else {
                    addMessage('system', '❌ Ошибка при отправке файла.');
                }
            } catch (error) {
                addMessage('system', '❌ Ошибка при отправке файла.');
            }
        };
        reader.readAsDataURL(file);
        
        fileInput.value = '';
    }

    function addMessage(type, text, isFile = false) {
        const container = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        const isUser = type === 'user';
        
        msgDiv.style.cssText = `
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 13px;
            word-wrap: break-word;
            ${isUser ? 'background: #4a9eff; color: white; align-self: flex-end; margin-left: auto;' : 
              type === 'admin' ? 'background: #00d4aa; color: #000; align-self: flex-start;' : 
              'background: #1e2a3a; color: #8899aa; align-self: center; font-size: 12px;'}
        `;
        msgDiv.textContent = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function startPolling() {
        stopPolling();
        chatPollingInterval = setInterval(async () => {
            if (!chatSessionId) return;
            try {
                const response = await fetch(`${SUPPORT_API}/chat/messages?session_id=${chatSessionId}`);
                const data = await response.json();
                
                if (data.messages) {
                    const container = document.getElementById('chatMessages');
                    const existingIds = Array.from(container.querySelectorAll('div[data-msg-id]')).map(el => el.dataset.msgId);
                    
                    data.messages.forEach(msg => {
                        if (!existingIds.includes(String(msg.id)) && msg.sender !== 'user') {
                            addMessage(msg.sender, msg.message);
                            const lastMsg = container.lastElementChild;
                            if (lastMsg) lastMsg.dataset.msgId = msg.id;
                        }
                    });
                }
            } catch (error) {
                console.error('Ошибка опроса:', error);
            }
        }, 3000);
    }

    function stopPolling() {
        if (chatPollingInterval) {
            clearInterval(chatPollingInterval);
            chatPollingInterval = null;
        }
    }

    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendChatMessage();
    });
</script>

</body>
</html>
